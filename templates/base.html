{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Naufal</title>
    
    {% block meta %}
    {% endblock meta %}
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- External CSS (Ini yang bikin tampilan lu rapi) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Navbar -->
    <header class="site-header">
        <div class="nav-container">
            <a href="{% url 'main:show_main' %}" class="brand">Naufal</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:project_list' %}">Projects</a>
            </nav>
        </div>
    </header>

    <!-- Tempat index.html, experience.html, project_list.html masuk -->
    {% block content %}
    {% endblock content %}

</body>
</html>
