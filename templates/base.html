{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Naufal</title>

    <!-- Google Fonts Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Memanggil CSS Asli -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Library Animasi Gelombang Menyala (Vanta.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Manrope', sans-serif;
            color: white;
            min-height: 100vh;
        }

        /* Container Animasi Latar Belakang */
        #bg-animasi {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1; 
        }

        /* Desain Navbar Glassmorphism */
        .site-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 25, 47, 0.4); /* Transparan */
            backdrop-filter: blur(15px); /* Efek Kaca */
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            padding: 1.2rem 5%;
            box-sizing: border-box;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-container a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-container a:hover {
            color: #60a5fa;
        }

        /* Area Konten Utama */
        .main-content {
            position: relative;
            z-index: 1;
            padding-top: 100px; /* Jarak agar konten tidak nabrak navbar */
            min-height: 100vh;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <!-- Canvas Gelombang Bergerak -->
    <div id="bg-animasi"></div>

    <!-- Navbar -->
    <header class="site-header">
        <div class="nav-container">
            <a href="{% url 'main:show_main' %}" style="font-weight: 800; font-size: 1.2rem; letter-spacing: 1px;">NAUFAL</a>
            <nav style="display: flex; gap: 2rem;">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="#">Experience</a>
                <a href="{% url 'main:project_list' %}" style="font-weight: 700; color: #60a5fa;">Projects</a>
            </nav>
        </div>
    </header>

    <!-- Konten Disuntikkan ke Sini -->
    <main class="main-content">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- Script Penggerak Animasi Gelombang -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            VANTA.WAVES({
                el: "#bg-animasi",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0x1d4ed8,      /* Warna gelombang biru neon */
                shininess: 45.00,
                waveHeight: 20.00,
                waveSpeed: 0.85,
                zoom: 0.85
            })
        })
    </script>
</body>
</html>
